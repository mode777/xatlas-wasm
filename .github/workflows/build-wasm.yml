name: Build WASM

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Verify Emscripten version
        run: emcc --version | head -n 1 | grep -F '3.1.64'

      - name: Install dependencies
        run: npm ci

      - name: Configure WASM build
        run: npm run configure

      - name: Build WASM module
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run packed-package consumer test
        run: npm run test:package

      - name: Compute artifact digests and sizes
        run: |
          set -euo pipefail
          rm -f dist/SHA256SUMS dist/SIZES
          files=(dist/xatlas.mjs dist/xatlas.wasm dist/index.mjs)
          for f in "${files[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::Expected artifact '$f' is missing or empty"
              exit 1
            fi
          done
          {
            echo "| Artifact | SHA-256 | Size |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in "${files[@]}"; do
            sha256sum "$f" | tee -a dist/SHA256SUMS
            stat -c '%n %s bytes' "$f" | tee -a dist/SIZES
            digest=$(sha256sum "$f" | cut -d ' ' -f 1)
            size=$(stat -c '%s' "$f")
            echo "| \`$f\` | \`$digest\` | $size bytes |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xatlas-wasm-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

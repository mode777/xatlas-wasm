name: Build & Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Verify Emscripten version
        run: emcc --version | head -n 1 | grep -F '3.1.64'

      - name: Verify toolchain
        run: |
          emcc --version
          cmake --version
          node --version

      - name: Install dependencies
        run: npm ci

      - name: Configure WASM build
        run: npm run configure

      - name: Build WASM module
        run: npm run build

      - name: Verify dist artifacts
        run: |
          test -f dist/index.mjs
          test -f dist/xatlas.wasm
          test -f lib/xatlas.d.ts
          echo "All expected artifacts present."

      - name: Run tests
        run: npm test

      - name: Run packed-package consumer test
        run: npm run test:package

      - name: Compute artifact digests and sizes
        run: |
          set -euo pipefail
          rm -f dist/SHA256SUMS dist/SIZES
          files=(dist/xatlas.mjs dist/xatlas.wasm dist/index.mjs)
          for f in "${files[@]}"; do
            if [ ! -s "$f" ]; then
              echo "::error::Expected artifact '$f' is missing or empty"
              exit 1
            fi
          done
          {
            echo "| Artifact | SHA-256 | Size |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in "${files[@]}"; do
            sha256sum "$f" | tee -a dist/SHA256SUMS
            stat -c '%n %s bytes' "$f" | tee -a dist/SIZES
            digest=$(sha256sum "$f" | cut -d ' ' -f 1)
            size=$(stat -c '%s' "$f")
            echo "| \`$f\` | \`$digest\` | $size bytes |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Generate release provenance
        run: |
          set -euo pipefail
          {
            echo "Emscripten: $(emcc --version | head -n 1)"
            echo "Node.js: $(node --version)"
            echo "Source commit: $GITHUB_SHA"
            echo "thirdparty/xatlas commit: $(git -C thirdparty/xatlas rev-parse HEAD)"
            echo ""
            echo "SHA-256:"
            cat dist/SHA256SUMS
            echo ""
            echo "Sizes:"
            cat dist/SIZES
          } > dist/PROVENANCE.txt
          cat dist/PROVENANCE.txt
          {
            echo "### Release provenance"
            echo ""
            echo '```'
            cat dist/PROVENANCE.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach provenance to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/PROVENANCE.txt --clobber

      - name: Publish to npm
        run: npm publish --provenance --access public

schema: spec-driven

# Project context: constraints an agent cannot infer by reading the code alone.
context: |
  Repo purpose: WebAssembly build of the xatlas UV-atlas generation library,
  packaged as the npm module `xatlas-wasm` (ESM-only, async `createXAtlas()`,
  Flat API + TypeScript declarations, Node >= 16 and modern browsers).
  In scope: the xatlas C API wrapper, type definitions, the Emscripten/CMake
  build, the npm package and its CI/release flow. Out of scope: changing
  xatlas's atlas-generation algorithm, the upstream xatlas sources, or adding
  pthreads/SharedArrayBuffer support in the current sequence.

  Current baseline: xatlas-wasm@0.1.3 uses Emscripten SINGLE_FILE=1, so the
  wasm is base64-embedded in dist/xatlas.mjs / dist/index.mjs. There are no
  loader options, no image accessor, no lifetime safety net and no push/PR CI.
  The detailed audit, measured evidence and prioritised improvement items live
  in docs/improvements.md (IDs XW-001..XW-024). That document is the backlog
  for this OpenSpec workflow; proposals must reference the IDs they implement.

  Target direction (subject to individual change designs):
  - separate `xatlas.wasm` with explicit `wasmBinary`/`locateFile` options,
    browser/Node/worker support and bundler-neutral JS;
  - validated mesh inputs, idempotent object lifetimes, bounded result access
    and a bulk typed-array mesh-result API;
  - pinned Emscripten 3.1.64, push/PR build-and-test CI, a packed-package
    consumer test, and a tag-gated provenance release.

  Upstream xatlas is pinned as the git submodule at thirdparty/xatlas. Do not
  edit files under thirdparty/xatlas in-tree; wrapper/accessor work belongs in
  src/xatlas_wasm.c and lib/. Build outputs (build/, dist/) are gitignored;
  build logic belongs in CMakeLists.txt, package.json and .github/workflows.

  Public contract: lib/xatlas.d.ts and API.md must stay in sync with the
  runtime. Any documented option must be implemented and tested. Keep the
  package runtime-dependency-free and the public surface small; the wrapper's
  simplicity is a feature.

  Workflow: all functional work is proposed, specified, implemented and
  archived as OpenSpec changes under openspec/changes/<name>/ (proposal,
  specs, design, tasks). The first change should capture the current behaviour
  as baseline specs. Work directly on main with concise commits; once the
  push/PR build workflow lands, keep it green.

# Per-artifact rules
rules:
  proposal:
    - Reference the docs/improvements.md item IDs (XW-###) the change implements; state explicitly which of loader/artifact, public API, package layout, or CI/release behaviour changes.
    - Keep the proposal scoped to one independently shippable change; list what is out of scope and any follow-up it deliberately defers.
    - Note whether the change alters the current SINGLE_FILE/loader contract or remains compatible with it.
  design:
    - Ground the design in docs/improvements.md and the current loader/API implementation; cite concrete files and measured sizes where relevant.
    - Preserve the ESM-only, Node >= 16 (target >= 18), modern-browser contract and the single-threaded (XA_MULTITHREADED=0) kernel unless the change explicitly proposes otherwise.
    - For loader changes, cover Node, browser and worker paths, bundled/installed layouts, and the failure mode when the wasm artifact is missing.
    - For API changes, specify ownership/lifetime of returned typed arrays and the use-after-destroy contract.
  specs:
    - Specs describe observable behaviour and requirements, including error cases; rationale and trade-offs belong in the design or docs/improvements.md.
    - Every new option or method needs at least one scenario for the success path and one for misuse/failure.
  tasks:
    - Include tasks for tests, type declarations, API.md/README updates, and a packed-package consumer check when packaging changes.
    - Include a task to update docs/improvements.md (mark the item implemented or record the remaining work).
    - Include a task to verify `openspec validate --all --strict` before archive.

# Per-operation guidance
operations:
  apply:
    guidance:
      - Build and test against Emscripten 3.1.64; run the Node smoke test and, for loader/package changes, the packed-package consumer test.
      - Record wasm/bundle size and the getMesh benchmark when artifact or result-marshalling behaviour changes.
      - Keep API.md, lib/xatlas.d.ts and runtime behaviour in lockstep; do not leave a documented option unimplemented.
  archive:
    guidance:
      - Before archiving, reconcile the synced specs with docs/improvements.md and mark the implemented XW-### items.
      - Confirm the package still passes the packed-package consumer test and that no generated build output was committed.
